services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: larp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: larp_finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larp_user -d larp_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build: .
    image: larp-finance:dev
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://larp_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/larp_finance
    entrypoint: ["sh", "-c"]
    command:
      - "alembic upgrade head && python -m larp_finance.seed_assets"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: larp-finance:dev
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://larp_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/larp_finance
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data: